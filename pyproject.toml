[project]
name = "quic-pubsub"
version = "0.1.0"
description = "A QUIC-native distributed pub/sub message broker"
requires-python = ">=3.11"
dependencies = [
    "aioquic>=1.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["transport", "broker", "utils"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
